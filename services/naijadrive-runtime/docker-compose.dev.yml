services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-naijadrive}
      POSTGRES_USER: ${POSTGRES_USER:-naijadrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naijadrive_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT PostGIS_Version()' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - naijadrive_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  naijadrive_pgdata:
