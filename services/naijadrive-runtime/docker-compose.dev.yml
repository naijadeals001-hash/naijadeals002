services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: naijadrive
      POSTGRES_USER: naijadrive
      POSTGRES_PASSWORD: naijadrive_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naijadrive -d naijadrive"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - naijadrive_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  naijadrive_pgdata:
